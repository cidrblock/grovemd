[project]
name = "grovemd"
version = "0.1.0"
description = "Grove — filesystem-backed Markdown workspace"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grovemd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
