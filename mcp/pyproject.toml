[project]
name = "grove-mcp"
version = "0.1.0"
readme = "README.md"
description = "Grove notes MCP — search/list/read Markdown under /mnt/space16/grove-data"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.4.1,<2",
]

[project.scripts]
grove-mcp = "grove_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grove_mcp"]
