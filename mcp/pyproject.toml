[project]
name = "grove-mcp"
version = "0.1.0"
readme = "README.md"
description = "Grove notes MCP — search/list/read Markdown under /mnt/space16/grove-data"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.4.1,<2",
    "markdown-it-py>=3.0.0,<5",
    "nh3>=0.2.21,<1",
]

[project.scripts]
grove-mcp = "grove_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grove_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/grove_mcp/static/mcp-app.js" = "grove_mcp/static/mcp-app.js"
